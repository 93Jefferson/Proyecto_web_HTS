<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="p1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="accent1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="360" rx="12" fill="url(#p1Grad)"/>
  
  <!-- Browser mockup bar -->
  <rect x="0" y="0" width="600" height="42" fill="#0b1120"/>
  <circle cx="25" cy="21" r="6" fill="#ef4444"/>
  <circle cx="45" cy="21" r="6" fill="#f59e0b"/>
  <circle cx="65" cy="21" r="6" fill="#10b981"/>
  <rect x="95" y="10" width="220" height="22" rx="6" fill="#1e293b"/>
  <text x="110" y="25" font-family="monospace" font-size="11" fill="#64748b">https://mi-ecommerce.app</text>

  <!-- Content representation: E-commerce store -->
  <rect x="35" y="65" width="530" height="45" rx="8" fill="#1e293b"/>
  <rect x="55" y="78" width="90" height="18" rx="4" fill="url(#accent1)"/>
  <circle cx="535" cy="87" r="14" fill="#334155"/>

  <!-- Products cards representation -->
  <g transform="translate(35, 130)">
    <rect width="160" height="190" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect x="15" y="15" width="130" height="90" rx="6" fill="#0f172a"/>
    <rect x="15" y="120" width="90" height="12" rx="3" fill="#94a3b8"/>
    <rect x="15" y="140" width="60" height="10" rx="3" fill="#64748b"/>
    <rect x="15" y="160" width="130" height="18" rx="4" fill="#0284c7"/>
  </g>

  <g transform="translate(220, 130)">
    <rect width="160" height="190" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect x="15" y="15" width="130" height="90" rx="6" fill="#0f172a"/>
    <rect x="15" y="120" width="100" height="12" rx="3" fill="#94a3b8"/>
    <rect x="15" y="140" width="70" height="10" rx="3" fill="#64748b"/>
    <rect x="15" y="160" width="130" height="18" rx="4" fill="#0284c7"/>
  </g>

  <g transform="translate(405, 130)">
    <rect width="160" height="190" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect x="15" y="15" width="130" height="90" rx="6" fill="#0f172a"/>
    <rect x="15" y="120" width="85" height="12" rx="3" fill="#94a3b8"/>
    <rect x="15" y="140" width="55" height="10" rx="3" fill="#64748b"/>
    <rect x="15" y="160" width="130" height="18" rx="4" fill="#0284c7"/>
  </g>
</svg>
