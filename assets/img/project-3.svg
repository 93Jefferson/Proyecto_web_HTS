<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="p3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1f2937" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="360" rx="12" fill="url(#p3Grad)"/>
  
  <!-- Browser mockup bar -->
  <rect x="0" y="0" width="600" height="42" fill="#030712"/>
  <circle cx="25" cy="21" r="6" fill="#ef4444"/>
  <circle cx="45" cy="21" r="6" fill="#f59e0b"/>
  <circle cx="65" cy="21" r="6" fill="#10b981"/>
  <rect x="95" y="10" width="220" height="22" rx="6" fill="#1f2937"/>
  <text x="110" y="25" font-family="monospace" font-size="11" fill="#6b7280">https://task-kanban.io</text>

  <!-- Kanban Columns -->
  <!-- Column 1: Por hacer -->
  <g transform="translate(30, 65)">
    <rect width="165" height="265" rx="8" fill="#1f2937" stroke="#374151" stroke-width="1"/>
    <text x="15" y="25" font-family="sans-serif" font-size="12" font-weight="bold" fill="#9ca3af">POR HACER (3)</text>
    <!-- Card 1 -->
    <rect x="12" y="40" width="141" height="60" rx="6" fill="#111827"/>
    <rect x="22" y="52" width="70" height="8" rx="2" fill="#e5e7eb"/>
    <rect x="22" y="68" width="100" height="6" rx="2" fill="#6b7280"/>
    <rect x="22" y="82" width="35" height="10" rx="4" fill="#ef4444" opacity="0.8"/>
    <!-- Card 2 -->
    <rect x="12" y="110" width="141" height="60" rx="6" fill="#111827"/>
    <rect x="22" y="122" width="80" height="8" rx="2" fill="#e5e7eb"/>
    <rect x="22" y="138" width="90" height="6" rx="2" fill="#6b7280"/>
    <rect x="22" y="152" width="40" height="10" rx="4" fill="#3b82f6" opacity="0.8"/>
  </g>

  <!-- Column 2: En progreso -->
  <g transform="translate(217, 65)">
    <rect width="165" height="265" rx="8" fill="#1f2937" stroke="#374151" stroke-width="1"/>
    <text x="15" y="25" font-family="sans-serif" font-size="12" font-weight="bold" fill="#60a5fa">EN PROCESO (2)</text>
    <!-- Card 1 -->
    <rect x="12" y="40" width="141" height="75" rx="6" fill="#111827" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="22" y="52" width="90" height="8" rx="2" fill="#e5e7eb"/>
    <rect x="22" y="68" width="115" height="6" rx="2" fill="#6b7280"/>
    <rect x="22" y="80" width="70" height="6" rx="2" fill="#6b7280"/>
    <rect x="22" y="96" width="45" height="10" rx="4" fill="#f59e0b" opacity="0.8"/>
  </g>

  <!-- Column 3: Completado -->
  <g transform="translate(405, 65)">
    <rect width="165" height="265" rx="8" fill="#1f2937" stroke="#374151" stroke-width="1"/>
    <text x="15" y="25" font-family="sans-serif" font-size="12" font-weight="bold" fill="#34d399">TERMINADO (4)</text>
    <!-- Card 1 -->
    <rect x="12" y="40" width="141" height="60" rx="6" fill="#111827"/>
    <rect x="22" y="52" width="85" height="8" rx="2" fill="#e5e7eb"/>
    <rect x="22" y="68" width="95" height="6" rx="2" fill="#6b7280"/>
    <rect x="22" y="82" width="38" height="10" rx="4" fill="#10b981" opacity="0.8"/>
    <!-- Card 2 -->
    <rect x="12" y="110" width="141" height="60" rx="6" fill="#111827"/>
    <rect x="22" y="122" width="65" height="8" rx="2" fill="#e5e7eb"/>
    <rect x="22" y="138" width="110" height="6" rx="2" fill="#6b7280"/>
    <rect x="22" y="152" width="42" height="10" rx="4" fill="#10b981" opacity="0.8"/>
  </g>
</svg>
