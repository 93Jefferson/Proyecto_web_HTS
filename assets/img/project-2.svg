<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="p2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#162032" />
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="rgba(16, 185, 129, 0.1)" />
      <stop offset="100%" stop-color="rgba(16, 185, 129, 0.6)" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="360" rx="12" fill="url(#p2Grad)"/>
  
  <!-- Browser mockup bar -->
  <rect x="0" y="0" width="600" height="42" fill="#0b1120"/>
  <circle cx="25" cy="21" r="6" fill="#ef4444"/>
  <circle cx="45" cy="21" r="6" fill="#f59e0b"/>
  <circle cx="65" cy="21" r="6" fill="#10b981"/>
  <rect x="95" y="10" width="220" height="22" rx="6" fill="#1e293b"/>
  <text x="110" y="25" font-family="monospace" font-size="11" fill="#64748b">https://dashboard-metricas.io</text>

  <!-- Sidebar -->
  <rect x="25" y="60" width="110" height="275" rx="8" fill="#1e293b"/>
  <rect x="40" y="80" width="80" height="14" rx="4" fill="#38bdf8"/>
  <rect x="40" y="110" width="65" height="10" rx="3" fill="#64748b"/>
  <rect x="40" y="135" width="70" height="10" rx="3" fill="#64748b"/>
  <rect x="40" y="160" width="55" height="10" rx="3" fill="#64748b"/>

  <!-- Top KPI Cards -->
  <g transform="translate(155, 60)">
    <rect width="130" height="65" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="15" y="25" font-family="sans-serif" font-size="10" fill="#94a3b8">USUARIOS</text>
    <text x="15" y="50" font-family="sans-serif" font-weight="bold" font-size="18" fill="#38bdf8">14,250</text>
  </g>

  <g transform="translate(300, 60)">
    <rect width="130" height="65" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="15" y="25" font-family="sans-serif" font-size="10" fill="#94a3b8">CONVERSIÓN</text>
    <text x="15" y="50" font-family="sans-serif" font-weight="bold" font-size="18" fill="#10b981">84.6%</text>
  </g>

  <g transform="translate(445, 60)">
    <rect width="130" height="65" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="15" y="25" font-family="sans-serif" font-size="10" fill="#94a3b8">INGRESOS</text>
    <text x="15" y="50" font-family="sans-serif" font-weight="bold" font-size="18" fill="#f59e0b">$38,900</text>
  </g>

  <!-- Big Chart Card -->
  <g transform="translate(155, 140)">
    <rect width="420" height="195" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="20" y="30" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f8fafc">Actividad Semanal</text>
    
    <!-- Grid lines -->
    <line x1="20" y1="60" x2="400" y2="60" stroke="#334155" stroke-width="1" stroke-dasharray="4,4"/>
    <line x1="20" y1="100" x2="400" y2="100" stroke="#334155" stroke-width="1" stroke-dasharray="4,4"/>
    <line x1="20" y1="140" x2="400" y2="140" stroke="#334155" stroke-width="1" stroke-dasharray="4,4"/>

    <!-- Area chart -->
    <path d="M 30 150 Q 80 120 130 130 T 230 80 T 330 90 T 390 50 L 390 170 L 30 170 Z" fill="url(#chartGrad)"/>
    <path d="M 30 150 Q 80 120 130 130 T 230 80 T 330 90 T 390 50" fill="none" stroke="#10b981" stroke-width="3"/>
  </g>
</svg>
